<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>プロセカ譜面ビューア — プレイヤー</title>
<style>
  :root{--ink:#e5edf7;--mut:#9fb0c7;--acc:#8ef0e2;--panel:#16233a;--line:#2a3d57}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0a1220;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;overflow-x:hidden}
  body{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0f1a2b;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .song{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  header .song img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#223}
  header .song b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .song span{font-size:12px;color:var(--mut)}
  header .lv{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:700;color:#fff}
  button{font:inherit;color:var(--ink);background:#1d2c42;border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
  button:hover{background:#26395a}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:#0e3a33;border-color:#2a6b5e;color:var(--acc)}
  #panel{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
  #panel.hidden{display:none}
  .ctl{display:flex;flex-direction:column;gap:3px;min-width:110px}
  .ctl label{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
  .ctl label b{color:var(--acc);font-weight:400;font-variant-numeric:tabular-nums}
  .ctl input[type=range]{width:150px;accent-color:var(--acc)}
  .ctl select{background:#0f1a2b;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px}
  .ctl .row{display:flex;gap:6px;align-items:center}
  .ctl .row button{padding:5px 9px;font-size:12px}
  .ctl .note{font-size:11px;color:var(--mut);max-width:220px}
  .sec{border-left:1px solid var(--line);padding-left:16px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 10px 6px;gap:6px}
  #wrap{position:relative;width:min(100%,960px)}
  #gview{display:block;width:100%;aspect-ratio:1920/1080;background:#0a1220;border-radius:10px}
  #stage{display:none;width:100%;background:#0d1524;border-radius:10px}
  #stage.show{display:block}
  #gview.hide{display:none}
  #hud{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
  #hud b{color:var(--ink);font-variant-numeric:tabular-nums}
  #stat{font-size:11px;color:#6b7d96;text-align:center}
  footer{position:sticky;bottom:0;background:#0f1a2b;border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .seek{display:flex;align-items:center;gap:10px}
  .seek input{flex:1;accent-color:var(--acc)}
  .seek span{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
  .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  .btns button{min-width:52px}
  #astat{text-align:center;font-size:12px;color:var(--mut);min-height:16px}
  #err{display:none;margin:14px;padding:16px;background:#3a1620;border:1px solid #7a2b3a;border-radius:10px;color:#ffc9d1}
  .kbd{font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div class="song"><img id="jk" alt=""><div><b id="title">譜面</b><span id="sub"></span></div></div>
  <button id="bView" type="button" title="表示切替 (V)">譜面再生</button>
  <button id="bPanel" type="button">表示設定</button>
  <button id="bBack" type="button">← 戻る</button>
</header>
<div id="panel">
  <div class="ctl"><label for="rate">速度 <b id="ratev">1.00×</b></label><input id="rate" type="range" min="0.25" max="1" step="0.05" value="1"></div>
  <div class="ctl"><label for="vol">音量 <b id="volv">100%</b></label><input id="vol" type="range" min="0" max="100" step="1" value="100"></div>
  <div class="ctl"><label for="ao">音源タイミング補正 <b id="aov">+0.00秒</b></label><input id="ao" type="range" min="-3" max="3" step="0.05" value="0"></div>
  <div class="ctl"><label for="spd">ハイスピード <b id="spdv">6.00</b></label><input id="spd" type="range" min="1" max="12" step="0.25" value="6"></div>
  <div class="ctl"><label for="rk">速度変化 <b></b></label><select id="rk"><option value="all">譜面に任せる</option><option value="keep">速度維持</option></select></div>
  <div class="ctl"><label for="ap">出現開始 <b id="apv">0%</b></label><input id="ap" type="range" min="0" max="100" step="1" value="0"></div>
  <div class="ctl"><label for="sf">ソフラン <b></b></label><select id="sf"><option value="on">有効</option><option value="off">無効</option></select></div>
  <div class="ctl"><label for="mir">ミラー <b></b></label><select id="mir"><option value="off">無効</option><option value="on">有効</option></select></div>
  <div class="ctl"><label for="vocal">ボーカル <b></b></label><select id="vocal"></select></div>
  <div class="ctl"><label for="slO">スライド透明度 <b id="slOv">100%</b></label><input id="slO" type="range" min="0" max="100" step="5" value="100"></div>
  <div class="ctl"><label for="gdO">ガイド透明度 <b id="gdOv">40%</b></label><input id="gdO" type="range" min="0" max="100" step="5" value="40"></div>
  <div class="ctl sec"><label for="skin">ノーツスキン <b></b></label>
    <select id="skin"><option value="1">notes_01</option><option value="2">notes_02</option></select>
    <div class="note">ノーツ・帯・矢印の見た目を切り替えます</div></div>
  <div class="ctl sec"><label for="fxv">エフェクト <b></b></label>
    <select id="fxv"><option value="0">パターン 0</option><option value="1">パターン 1</option></select>
    <div class="note">ヒットエフェクトの出方を切り替えます</div></div>
  <div class="ctl sec"><label for="bgB">背景の明るさ <b id="bgBv">100%</b></label><input id="bgB" type="range" min="10" max="150" step="5" value="100">
    <label for="cover">ステージカバー <b id="coverv">0%</b></label><input id="cover" type="range" min="0" max="100" step="5" value="0"></div>
  <div class="ctl sec"><label>出力遅延 <b id="latv"></b></label>
    <div class="row"><button id="bLat" type="button">自動計測</button><button id="bTap" type="button">タップ調整</button></div>
    <div class="note" id="latNote">Bluetooth 等の環境差を吸収します。手動は下のスライダで。</div>
    <label for="manualMs">手動調整 <b id="manualMsv">0 ms</b></label><input id="manualMs" type="range" min="-300" max="300" step="5" value="0"></div>
  <div class="ctl sec"><label>書き出し <b></b></label>
    <div class="row"><button id="bWav" type="button">WAV 書き出し</button>
    <select id="wavRate"><option value="1">等速</option><option value="0.5">0.5×</option><option value="2">2×</option></select></div>
    <div class="note">再生中の速度とは別に、指定した速度でボーカル音源を WAV に書き出します</div></div>
</div>
<main>
  <div id="wrap">
    <canvas id="gview" width="1920" height="1080"></canvas>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"><defs></defs></svg>
  </div>
  <div id="hud"><span>小節 <b id="hB">1</b></span><span>BPM <b id="hBpm">-</b></span><span>速度 <b id="hHs">×1.00</b></span><span>ノーツ <b id="hN">-</b></span></div>
  <div id="stat"></div>
  <div id="err"></div>
</main>
<footer>
  <div class="seek"><span id="tcur">0:00.0</span><input id="seek" type="range" min="0" max="100" step="0.01" value="0"><span id="tend">0:00</span></div>
  <div class="btns">
    <button id="bStart" type="button">頭出し</button>
    <button id="bBack2" type="button">-5秒</button>
    <button id="bPlay" type="button">▶ 再生</button>
    <button id="bFwd" type="button">+5秒</button>
    <button id="bEnd" type="button">最後へ</button>
  </div>
  <div id="astat"></div>
  <div class="kbd">Space: 再生/停止　←→: ±1秒（Shiftで±5秒）　↑↓: 小節移動　Home/End: 頭/最後　V: 表示切替</div>
</footer>
<script src="js/wasm-loader.js"></script>
<script src="js/gl-renderer.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
<script src="js/flat-view.js"></script>
<script src="js/stepper.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'sekaiChartViewer.settings.v1';
  var MASTER = 'https://sekai-world.github.io/sekai-master-db-diff/';
  var errBox = $('err');
  function showErr(m) { errBox.style.display = 'block'; errBox.textContent = m; }
  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var m = Math.floor(t / 60), s = t - m * 60;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
  }

  var engine = null, flat = null, view = 'game';
  var D = null, pf = null, songInfo = null, demo = /[?&]demo/.test(location.search);
  var playing = false, dragging = false, lastState = null;
  var VL = [], vi = 0, FS = 0;

  function loadPlayerPrefs() {
    try { return (JSON.parse(localStorage.getItem(KEY)) || {}).player || {}; } catch (e) { return {}; }
  }
  function savePrefs() {
    if (!engine) return;
    try {
      var v = JSON.parse(localStorage.getItem(KEY)) || {};
      var s = engine.settings;
      v.player = Object.assign({}, v.player, {
        spd: s.spd, rate: s.rate, apb: s.ap, sf: !s.noSofran, rk: s.rk,
        aoff: s.ao, vol: s.vol, vw: view,
        skin: s.skin, fxv: s.fxVariant, bgB: Math.round(s.bgBrightness * 100),
        cover: Math.round(s.coverOpacity * 100),
        manualMs: s.manualMs, autoMs: s.autoMs
      });
      delete v.player.vt; delete v.player.ap;
      localStorage.setItem(KEY, JSON.stringify(v));
    } catch (e) {}
    try { if (window.parent && parent.__setShared) parent.__setShared({ slideOpacity: engine.settings.sl, guideOpacity: engine.settings.gd, mirror: engine.settings.mirror }); } catch (e) {}
  }

  function parentFetch(kind, arg) {
    try {
      if (kind === 'cget' && parent.__cget) return Promise.resolve(parent.__cget('audio/' + arg));
      if (kind === 'jget' && parent.__jget) return Promise.resolve(parent.__jget(arg));
    } catch (e) {}
    return Promise.reject(new Error('parent unavailable'));
  }
  function fetchAudioBuffer(asset) {
    return parentFetch('cget', asset).then(function (buf) {
      if (buf) return buf;
      throw new Error('no cache');
    }).catch(function () {
      return fetch('https://sekai.best/assets/' + asset + '.mp3').then(function (r) {
        if (!r.ok) throw new Error('audio ' + r.status);
        return r.arrayBuffer();
      });
    });
  }
  var audioProvider = {
    fetchAudio: function (asset) {
      return fetchAudioBuffer(asset).then(function (ab) { return engine.decodeAudio(ab); });
    },
    fetchJson: function (url) {
      return parentFetch('jget', url).then(function (j) { if (j) return j; throw new Error('no cache'); })
        .catch(function () { return fetch(MASTER + url).then(function (r) { if (!r.ok) throw new Error('master ' + r.status); return r.json(); }); });
    }
  };

  function initA() {
    if (!songInfo || !songInfo.id) { $('vocal').innerHTML = '<option value="0">ボーカルなし</option>'; return; }
    var sid = songInfo.id;
    var done = function (v) {
      var arr = [];
      if (v && v[1]) for (var i = 1; i < v.length; i++) { var o = v[i]; if (o && o.asset) arr.push(o); }
      VL = arr;
      var sel = $('vocal');
      sel.innerHTML = arr.map(function (o, i) { return '<option value="' + i + '">' + escapeHtml(o.name || o.asset) + '</option>'; }).join('') || '<option value="0">ボーカルなし</option>';
      if (FS && VL.length) {
        var idx = 0;
        for (var j = 0; j < VL.length; j++) if (VL[j].asset === FS) idx = j;
        vi = idx; sel.value = String(idx);
      }
      loadVocal();
    };
    audioProvider.fetchJson('musics/' + sid + '.json').then(function (m) {
      if (!m || !m[0] || !m[0].vocalVersions) { done(null); return; }
      var vv = m[0].vocalVersions;
      Promise.all(vv.map(function (v) {
        return audioProvider.fetchJson('musicVocals/' + v.id + '.json').catch(function () { return null; });
      })).then(function (vs) {
        var list = [null];
        vs.forEach(function (mv, i) {
          var v = vv[i];
          if (!mv || !mv[0] || !mv[0].asset) return;
          var singers = [];
          (mv[0].singerCharacters || []).forEach(function (sc) {
            singers.push(sc.characterType === 'game_character' ? 'キャラ' : 'バーチャル');
          });
          list.push({ asset: mv[0].asset, name: (v.vocalVersion || '') + (singers.length ? ' (' + singers.join('・') + ')' : '') });
        });
        done(list);
      });
    }).catch(function () { done(null); });
  }
  function loadVocal() {
    if (!engine) return;
    var asset = VL[vi] && VL[vi].asset;
    engine.loadVocal(asset || null).then(function (ok) {
      $('astat').textContent = asset ? (ok ? '' : 'ボーカル音源の読み込みに失敗しました') : '';
    });
  }
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function updateHUD(st) {
    lastState = st;
    $('hB').textContent = Math.max(1, Math.floor(st.bar) + 1);
    $('hBpm').textContent = st.bpm.toFixed(1);
    $('hHs').textContent = '×' + st.speed.toFixed(2);
    $('hN').textContent = (engine.drawData ? engine.drawData.notes.length : 0).toLocaleString();
    $('tcur').textContent = fmt(Math.max(0, st.now));
    $('tend').textContent = fmt(st.duration);
    if (!dragging) $('seek').value = st.duration > 0 ? Math.max(0, Math.min(100, st.now / st.duration * 100)) : 0;
    if (st.playing !== playing) { playing = st.playing; $('bPlay').textContent = playing ? '⏸ 停止' : '▶ 再生'; }
    var stat = [];
    stat.push(engine.core && engine.core.isWasm ? 'WASM' : 'JSコア');
    stat.push(engine.renderer && engine.renderer.supported ? 'WebGL2' : 'WebGL2なし');
    if (st.fps) stat.push(st.fps.toFixed(0) + ' fps');
    if (st.quads) stat.push(st.quads + ' quads / ' + st.drawCalls + ' draws');
    if (engine.settings.autoMs) stat.push('遅延自動補正 ' + (engine.settings.autoMs > 0 ? '+' : '') + engine.settings.autoMs + ' ms');
    $('stat').textContent = stat.join(' · ');
    if (view === 'flat' && flat) flat.draw(st.now);
  }

  function setView(v) {
    view = v === 'flat' ? 'flat' : 'game';
    $('gview').classList.toggle('hide', view === 'flat');
    $('stage').classList.toggle('show', view === 'flat');
    $('bView').textContent = view === 'flat' ? 'ゲーム画面' : '譜面再生';
    if (engine) engine.setViewMode(view);
    if (view === 'flat' && flat && lastState) flat.draw(lastState.now);
    if (engine) engine.requestDraw();
    savePrefs();
  }

  function boot(data) {
    D = data.D; pf = data.pf || {}; songInfo = data.songInfo || null; FS = data.fs || 0;
    if (!D || (!D.nodes.length && !D.chains.length)) { showErr('再生できるノーツがありません'); return; }
    document.title = (songInfo ? songInfo.title : (data.meta && data.meta.TITLE) || '譜面') + ' — プロセカ譜面ビューア';
    $('title').textContent = songInfo ? songInfo.title : (data.meta && data.meta.TITLE) || '譜面';
    var lv = songInfo ? (songInfo.diff || '').toUpperCase() + (songInfo.level != null ? ' Lv' + songInfo.level : '') : '';
    $('sub').textContent = lv + (songInfo && songInfo.artist ? '　' + songInfo.artist : '');
    if (songInfo && songInfo.jk) $('jk').src = songInfo.jk;
    if (data.sprites) $('stage').querySelector('defs').insertAdjacentHTML('beforeend', data.sprites);

    var pp = loadPlayerPrefs();
    var settings = {
      spd: pf.spd != null ? pf.spd : 6,
      rate: pf.rate != null ? pf.rate : 1,
      ap: pf.ap != null ? pf.ap : 0,
      noSofran: pf.sf === false,
      rk: pf.rk || 'all',
      sl: pf.sl != null ? pf.sl : 1,
      gd: pf.gd != null ? pf.gd : 0.4,
      mirror: !!pf.mirror,
      ao: pf.ao || 0,
      vol: pf.vol != null ? pf.vol : 1,
      skin: pp.skin || '1',
      fxVariant: pp.fxv != null ? +pp.fxv : 0,
      bgBrightness: pp.bgB != null ? pp.bgB / 100 : 1,
      coverOpacity: pp.cover != null ? pp.cover / 100 : 0,
      manualMs: pp.manualMs || 0,
      autoMs: pp.autoMs || 0
    };
    engine = new ProsekaEngine.Engine($('gview'), {
      assetsBase: 'assets/',
      settings: settings,
      audioProvider: audioProvider,
      onState: updateHUD,
      onSave: savePrefs
    });
    view = pf.vw === 'flat' ? 'flat' : 'game';
    flat = new ProsekaFlat.FlatView($('stage'), engine);
    window.__engine = engine; // debug handle (state inspection, tests)
    engine.init().then(function () {
      return engine.loadChart(null, D);
    }).then(function () {
      flat.applyAp(settings.ap);
      flat.setMirror(settings.mirror);
      syncPanel();
      setView(view);
      engine.requestDraw();
      initA();
      if (engine.renderer && !engine.renderer.supported) showErr('このブラウザでは WebGL2 が使えません。フラット表示（Vキー）に切り替えてご利用ください。');
      else if (engine.core && !engine.core.isWasm) $('stat').textContent += '　※ WASM が読み込めなかったため JS コアで動作中です';
    }).catch(function (e) {
      console.error(e);
      showErr('プレイヤーの初期化に失敗しました: ' + (e && e.message || e));
    });
    wireControls();
  }

  function syncPanel() {
    var s = engine.settings;
    $('rate').value = s.rate; $('ratev').textContent = s.rate.toFixed(2) + '×';
    $('vol').value = Math.round(s.vol * 100); $('volv').textContent = Math.round(s.vol * 100) + '%';
    $('ao').value = s.ao; $('aov').textContent = (s.ao >= 0 ? '+' : '') + s.ao.toFixed(2) + '秒';
    $('spd').value = s.spd; $('spdv').textContent = s.spd.toFixed(2);
    $('rk').value = s.rk; $('sf').value = s.noSofran ? 'off' : 'on';
    $('mir').value = s.mirror ? 'on' : 'off';
    $('ap').value = s.ap; $('apv').textContent = s.ap + '%';
    $('slO').value = Math.round(s.sl * 100); $('slOv').textContent = Math.round(s.sl * 100) + '%';
    $('gdO').value = Math.round(s.gd * 100); $('gdOv').textContent = Math.round(s.gd * 100) + '%';
    $('skin').value = String(s.skin);
    $('fxv').value = String(s.fxVariant);
    $('bgB').value = Math.round(s.bgBrightness * 100); $('bgBv').textContent = Math.round(s.bgBrightness * 100) + '%';
    $('cover').value = Math.round(s.coverOpacity * 100); $('coverv').textContent = Math.round(s.coverOpacity * 100) + '%';
    $('manualMs').value = s.manualMs; $('manualMsv').textContent = (s.manualMs > 0 ? '+' : '') + s.manualMs + ' ms';
    $('latv').textContent = s.autoMs ? ((s.autoMs > 0 ? '+' : '') + s.autoMs + ' ms') : '';
  }

  function wireControls() {
    var E = function (id, ev, fn) { $(id).addEventListener(ev, fn); };
    E('rate', 'input', function () {
      var r = +$('rate').value; $('ratev').textContent = r.toFixed(2) + '×';
      engine.setSettings({ rate: r }); savePrefs();
      clearTimeout(engine._rateT);
      engine._rateT = setTimeout(function () { if (engine.playing) engine.restartAudio(); }, 300);
    });
    E('vol', 'input', function () { var v = +$('vol').value / 100; $('volv').textContent = Math.round(v * 100) + '%'; engine.setSettings({ vol: v }); savePrefs(); });
    E('ao', 'input', function () {
      var a = +$('ao').value; $('aov').textContent = (a >= 0 ? '+' : '') + a.toFixed(2) + '秒';
      engine.setSettings({ ao: a }); savePrefs();
      if (engine.playing) engine.restartAudio();
    });
    E('spd', 'input', function () { var v = +$('spd').value; $('spdv').textContent = v.toFixed(2); engine.setSettings({ spd: v }); savePrefs(); });
    E('rk', 'change', function () { engine.setSettings({ rk: $('rk').value }); savePrefs(); });
    E('sf', 'change', function () { engine.setSettings({ noSofran: $('sf').value === 'off' }); savePrefs(); });
    E('mir', 'change', function () { engine.setSettings({ mirror: $('mir').value === 'on' }); flat.setMirror(engine.settings.mirror); savePrefs(); });
    E('ap', 'input', function () {
      var v = +$('ap').value; $('apv').textContent = v + '%';
      engine.setSettings({ ap: v }); flat.applyAp(v); savePrefs();
    });
    E('slO', 'input', function () { var v = +$('slO').value / 100; $('slOv').textContent = Math.round(v * 100) + '%'; engine.setSettings({ sl: v }); savePrefs(); });
    E('gdO', 'input', function () { var v = +$('gdO').value / 100; $('gdOv').textContent = Math.round(v * 100) + '%'; engine.setSettings({ gd: v }); savePrefs(); });
    E('skin', 'change', function () { engine.setSkin($('skin').value); savePrefs(); });
    E('fxv', 'change', function () { engine.setFxVariant(+$('fxv').value); savePrefs(); });
    E('bgB', 'input', function () { var v = +$('bgB').value / 100; $('bgBv').textContent = Math.round(v * 100) + '%'; engine.setSettings({ bgBrightness: v }); savePrefs(); });
    E('cover', 'input', function () { var v = +$('cover').value / 100; $('coverv').textContent = Math.round(v * 100) + '%'; engine.setSettings({ coverOpacity: v }); savePrefs(); });
    E('manualMs', 'input', function () {
      var v = +$('manualMs').value; $('manualMsv').textContent = (v > 0 ? '+' : '') + v + ' ms';
      engine.setSettings({ manualMs: v }); savePrefs();
      if (engine.playing) engine.restartAudio();
    });
    E('bLat', 'click', function () {
      $('latNote').textContent = '計測中…';
      engine.measureLatency().then(function (m) {
        $('latNote').textContent = '出力遅延 ' + m.clockMs.toFixed(0) + ' ms（自動補正 ' + (engine.settings.autoMs > 0 ? '+' : '') + engine.settings.autoMs + ' ms）';
        $('latv').textContent = (engine.settings.autoMs > 0 ? '+' : '') + engine.settings.autoMs + ' ms';
        savePrefs();
      }).catch(function () { $('latNote').textContent = '計測できませんでした'; });
    });
    E('bTap', 'click', function () {
      $('astat').textContent = 'リズムに合わせて画面を8回タップしてください（最初の2回は慣らしです）';
      engine.startTapTest(8, 500, function (res) {
        if (!res) { $('astat').textContent = 'タップが不足しました'; return; }
        $('astat').textContent = 'タップ誤差 中央値 ' + (res.median > 0 ? '+' : '') + res.median.toFixed(0) + ' ms → 手動調整を ' + (res.recommended > 0 ? '+' : '') + res.recommended + ' ms にしました';
        engine.setSettings({ manualMs: res.recommended });
        $('manualMs').value = res.recommended; $('manualMsv').textContent = (res.recommended > 0 ? '+' : '') + res.recommended + ' ms';
        savePrefs();
      });
      $('gview').focus();
    });
    $('gview').addEventListener('pointerdown', function () { if (engine._tapTest) engine._tapTest.tap(); });
    E('bWav', 'click', function () {
      var rate = +$('wavRate').value;
      $('astat').textContent = 'WAV を書き出し中…';
      engine.exportWav(rate).then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = ($('title').textContent || 'vocal') + '_' + rate + 'x.wav';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        $('astat').textContent = 'WAV を書き出しました';
      }).catch(function (e) { $('astat').textContent = '書き出しに失敗しました: ' + (e && e.message || e); });
    });
    E('vocal', 'change', function () { vi = +$('vocal').value; loadVocal(); });
    E('bView', 'click', function () { setView(view === 'game' ? 'flat' : 'game'); });
    E('bPanel', 'click', function () { $('panel').classList.toggle('hidden'); });
    E('bBack', 'click', function () { try { if (engine) engine.setPlay(false); } catch (e) {} if (parent.__closeLayer) parent.__closeLayer(); else window.close(); });
    E('bStart', 'click', function () { engine.seek(-1.6); });
    E('bEnd', 'click', function () { engine.seek(engine.getState().duration); });
    E('bPlay', 'click', function () { engine.setPlay(!engine.playing); });
    E('bFwd', 'click', function () { engine.seek(engine.cur + 5); });
    E('bBack2', 'click', function () { engine.seek(engine.cur - 5); });
    E('seek', 'input', function () {
      var st = engine.getState();
      engine.seek($('seek').value / 100 * st.duration);
    });
    E('seek', 'pointerdown', function () { dragging = true; });
    E('seek', 'pointerup', function () { dragging = false; });
    E('seek', 'change', function () { dragging = false; });

    addEventListener('keydown', function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var t = e.target, tag = t && t.tagName;
      if (tag === 'SELECT' || (tag === 'INPUT' && t.type === 'range' && /^Arrow|^Home|^End/.test(e.key))) return;
      var k = e.key, d = e.shiftKey ? 5 : 1;
      if (k === ' ') { if (tag === 'BUTTON') return; engine.setPlay(!engine.playing); }
      else if (k === 'ArrowLeft') engine.seek(engine.cur - d);
      else if (k === 'ArrowRight') engine.seek(engine.cur + d);
      else if (k === 'ArrowUp') engine.nextBar();
      else if (k === 'ArrowDown') engine.prevBar();
      else if (k === 'Home') engine.seek(-1.6);
      else if (k === 'End') engine.seek(engine.getState().duration);
      else if (k === 'v' || k === 'V') setView(view === 'game' ? 'flat' : 'game');
      else return;
      e.preventDefault();
    });
    var HM = '非表示になったため一時停止しました';
    var isHid = function () { return document.hidden || document.visibilityState === 'hidden'; };
    var goHide = function () { if (engine && engine.playing) { engine.setPlay(false); $('astat').textContent = HM; } };
    var goShow = function () {
      if (isHid() || !engine) return;
      engine.requestDraw();
      if ($('astat').textContent === HM) setTimeout(function () { if ($('astat').textContent === HM) $('astat').textContent = ''; }, 4000);
    };
    document.addEventListener('visibilitychange', function () { isHid() ? goHide() : goShow(); });
    addEventListener('pagehide', goHide);
    addEventListener('pageshow', goShow);

    window.__pl = {
      setView: setView,
      get view() { return view; },
      seek: function (t) { engine.seek(t); },
      draw: function () { engine.requestDraw(); },
      ui: function () { if (lastState) updateHUD(lastState); },
      setPlay: function (p) { engine.setPlay(p); },
      prevBar: function () { engine.prevBar(); },
      nextBar: function () { engine.nextBar(); },
      get t() { return engine ? engine.cur : 0; },
      get playing() { return engine ? engine.playing : false; },
      get dur() { return engine ? engine.getState().duration : 0; },
      get pps() { return engine ? engine.pps() : 0; },
      JY: 480
    };
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'proseka-play') return;
    boot(d);
  });
  try { if (window.parent && parent !== window) parent.postMessage({ type: 'proseka-ready' }, '*'); } catch (e) {}

  if (demo) {
    // Valid SUS (see parseSUS in index.html): taps #MMM1L, slides #MMM3LC,
    // BPM def #BPM01 + event #MMM08, measure length #MMM02.
    var demoSUS = [
      '#TITLE demo', '#ARTIST test',
      '#BPM01: 120',
      '#00102: 4',
      '#00108: 01',
      '#00112: 11000000',
      '#00113: 00110000',
      '#00212: 11000000',
      '#00214: 00001100',
      '#00312: 12000000',
      '#00315: 00000011',
      '#004320: 11000000',
      '#005320: 21000000',
      '#005340: 00310000',
      '#00612: 11000000',
      '#00712: 11000000'
    ].join('\n');
    var tryBoot = function () {
      try {
        if (parent && parent.__parseSUS && parent.__buildPlay) {
          var S = parent.__parseSUS(demoSUS), DD = parent.__buildPlay(S);
          boot({ D: DD, pf: { spd: 6, rate: 1, ap: 0, sf: true, rk: 'all', sl: 1, gd: 0.4, mirror: false, ao: 0, vol: 1, vw: 'game' }, songInfo: null, fs: 0, sprites: DD.sprites });
          return true;
        }
      } catch (e) {}
      return false;
    };
    if (!tryBoot()) setTimeout(function () { if (!tryBoot()) showErr('デモ譜面の読み込みには親アプリの解析関数が必要です。index.html から開いてください。'); }, 500);
  }

  try { stepperInit({ spd: [-1, -0.25, 0.25, 1], ao: [-0.5, -0.1, 0.1, 0.5], rate: [-0.1, -0.05, 0.05, 0.1], manualMs: [-50, -10, 10, 50] }, true); } catch (e) {}
})();
</script>
</body>
</html>
