<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SekaiGL ベンチ</title>
<style>body{margin:0;background:#101827;color:#e5edf7;font:13px system-ui,sans-serif}canvas{display:block;width:100%;max-width:1280px;aspect-ratio:16/9;margin:0 auto;background:#000}.p{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;padding:10px}input[type=range]{vertical-align:middle}</style>
<canvas id="c"></canvas>
<div class="p"><label>ノーツスキン <select id="sk"><option>notes_01</option><option>notes_02</option></select></label><label>背景の明るさ <input id="bg" type="range" max="100" value="100"></label><label>ステージカバーの不透明度 <input id="sc" type="range" max="100" value="100"></label><span id="st"></span></div>
<script src="gl.js"></script>
<script>
/* WebGL2描画の動作確認用。http(s)で開く（file://ではテクスチャが読めません）。ステージ・背景・スキン・アトラス・reciprocalW(ロング帯)・バッチ数を確認できます */
(async()=>{const $=i=>document.getElementById(i),st=$('st');
try{
 const A=await(await fetch('../assets/atlas.json')).json(),r=new SekaiGL.Renderer($('c')),T={},ld=async(k,u)=>{T[k]=r.texture(await SekaiGL.loadImage('../assets/'+u))};
 await Promise.all([ld('bg','stage/bg_overlay.png'),ld('lane','stage/lane_1920.png'),...['notes_01','notes_02'].flatMap(s=>[ld(s,s+'/notes.png'),ld(s+'L',s+'/long.png')])]);
 const G=A.stage,P=(u,s)=>{const y=G.ya+(G.yJ-G.ya)*s;return[G.cx+u*G.k*(y-G.ya),y]},LU=s=>G.k*(G.yJ-G.ya)*s,sf=z=>1/(1+4*z);
 const draw=t=>{const sk=$('sk').value,F=A.notes[sk].frames,bars=F.filter(f=>f.kind==='bar'),icons=F.filter(f=>f.kind==='icon'),b=$('bg').value/100,c=$('sc').value/100;
  r.begin();
  r.quad(T.bg,[0,-420,1920,-420,1920,1500,0,1500],[0,0,2048,2048],null,[b,b,b,1],0);
  r.quad(T.lane,[0,0,1920,0,1920,1080,0,1080],[0,0,1920,1080],null,[1,1,1,c],1);
  const sF=sf(.85),sN=sf(.05);   /* ロングの帯：奥行きに傾いた台形。q=s(reciprocalW)で歪まない */
  r.quad(T[sk+'L'],[...P(-2,sF),...P(2,sF),...P(2,sN),...P(-2,sN)],[0,0,T[sk+'L'].w,T[sk+'L'].h],[sF,sF,sN,sN],[1,1,1,.85],2);
  const sp=(f,u,s,wl,layer)=>{const W=wl*LU(s),H=W*f.h/f.w,[x,y]=P(u,s);r.quad(T[sk],[x-W/2,y-H/2,x+W/2,y-H/2,x+W/2,y+H/2,x-W/2,y+H/2],[f.x,f.y,f.x+f.w,f.y+f.h],null,[1,1,1,1],layer)};
  for(let i=0;i<6;i++)sp(bars[i%bars.length],-5+2*i,sf(((t/2200+i/6)%1)*.9),1.9,3);   /* 流れるノーツ(2レーン幅) */
  for(let i=0;i<4;i++)sp(icons[(i*7)%icons.length],-4.5+3*i,sf(.45),2.6,3);          /* アトラス内の別スプライト */
  r.end();st.textContent='描画命令 '+r.draws+' 回';requestAnimationFrame(draw)};
 requestAnimationFrame(draw)}catch(e){st.textContent='初期化エラー: '+e.message}})();
</script>
