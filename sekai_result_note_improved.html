<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9fd">
<title>セカイ リザルトノート — デザインプレビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f8fc;--surface:#fff;--surface-2:#f8fbff;--ink:#192f4b;--muted:#73859b;--line:#e3ebf4;--blue:#397bf6;--blue-2:#eaf2ff;--green:#18ad83;--green-2:#e5f8f1;--gold:#e8ae35;--gold-2:#fff5d8;--red:#d95769;--red-2:#fff0f1;--purple:#8160c9;--shadow:0 10px 32px rgba(32,76,124,.07);--shadow-sm:0 3px 12px rgba(32,76,124,.055);--sidebar:252px;--radius:18px;box-sizing:border-box;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box;margin:0}
html,body{height:100%;min-width:320px}
body{overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.65 "Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
input,select{min-width:0}
:focus-visible{outline:3px solid #397bf655;outline-offset:2px}
svg.icon{width:19px;height:19px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#app{height:100%;display:flex;min-width:0}
.sidebar{width:var(--sidebar);flex:none;display:flex;flex-direction:column;gap:7px;padding:18px 13px 14px;background:var(--surface);border-right:1px solid var(--line);z-index:25;overflow:hidden;transition:width .24s ease,transform .24s ease}
.sidebar.collapsed{width:78px}
.brand{height:54px;display:flex;align-items:center;gap:11px;padding:0 8px 11px;white-space:nowrap;flex:none}
.brand-mark{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#477df4 0%,#3d95ed 48%,#34c3a0 100%);box-shadow:0 6px 14px #4288ef36;flex:none}
.brand-mark .icon{width:21px;height:21px;stroke-width:2}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.brand-name small{display:block;font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-top:2px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#9baabc;padding:17px 12px 7px;white-space:nowrap}
.nav-button{position:relative;min-height:44px;width:100%;display:flex;align-items:center;gap:13px;border-radius:12px;padding:10px 13px;color:#71839a;text-align:left;white-space:nowrap;transition:background .18s,color .18s,transform .18s;flex:none}
.nav-button:hover{color:var(--ink);background:#f5f9fd}
.nav-button.active{background:linear-gradient(105deg,#eaf2ff,#edf9f6);color:#2e72e9;font-weight:700}
.nav-button.active:before{content:"";position:absolute;left:0;width:3px;height:24px;background:var(--blue);border-radius:0 3px 3px 0}
.nav-button .icon{width:19px;height:19px}
.nav-button span{overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .brand-name,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-button span,.sidebar.collapsed .sidebar-note span{display:none}
.sidebar.collapsed .brand{padding-inline:8px}
.sidebar.collapsed .nav-button{justify-content:center;padding-inline:0;position:relative}
.sidebar .sidebar-spacer{flex:1;min-height:12px}
.sidebar-note{padding:13px 11px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;color:var(--muted);font-size:11px;line-height:1.55;white-space:normal}
.sidebar-note strong{display:flex;align-items:center;gap:7px;color:#3778e7;font-size:11px;margin-bottom:4px;white-space:nowrap}
.sidebar-note strong .icon{width:15px;height:15px}
.sidebar.collapsed .sidebar-note{padding:12px 0;display:grid;place-items:center}
.main-shell{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{position:relative;z-index:10;flex:none;min-height:76px;padding:14px clamp(16px,2.6vw,36px);display:flex;align-items:center;gap:15px;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.icon-button{height:40px;width:40px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;color:#6d8098;transition:border-color .18s,color .18s,background .18s;flex:none}
.icon-button:hover{border-color:#b8d0f6;color:var(--blue);background:#fbfdff}
.page-heading{min-width:0;flex:1}
.page-heading h1{font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.035em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-heading p{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:9px;flex:none}
.top-select-wrap{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;white-space:nowrap}
select,.search-input,.number-input{height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;box-shadow:0 1px 2px #1a426008;outline:none;transition:border .18s,box-shadow .18s}
select:focus,.search-input:focus,.number-input:focus{border-color:#8eb8fb;box-shadow:0 0 0 3px #397bf61b}
.metric-select{height:38px;font-size:12px;font-weight:600;padding-right:28px}
.account-button{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;white-space:nowrap;color:#506781;font-size:12px}
.account-button:hover{border-color:#b8d0f6}
.account-avatar{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(145deg,#4285f4,#34a853);color:white;font-size:12px;font-weight:700}
.connection-dot{width:7px;height:7px;border-radius:99px;background:#19b987;box-shadow:0 0 0 3px #19b98717}
.notification-button{position:relative}
.notification-count{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border-radius:99px;background:#ed6274;color:#fff;font-size:10px;font-weight:700;border:2px solid #fff}
#view{flex:1;min-height:0;overflow:auto;padding:clamp(17px,2.5vw,34px);scroll-behavior:smooth}
.page{max-width:1500px;margin:0 auto;animation:fade-in .28s ease both}
.eyebrow{display:flex;align-items:center;gap:8px;color:#5288e8;font-size:11px;font-weight:700;letter-spacing:.09em;margin-bottom:7px}
.eyebrow .eyebrow-line{height:1px;width:22px;background:#91b5f1}
.page-title{font-size:24px;line-height:1.35;letter-spacing:-.04em;font-weight:700}
.page-subtitle{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.8}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.page-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{min-height:40px;display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:0 15px;border-radius:11px;background:linear-gradient(110deg,#397bf6,#34adbb);color:#fff;font-size:12px;font-weight:700;letter-spacing:.005em;box-shadow:0 5px 13px #397bf622;transition:transform .18s,box-shadow .18s,filter .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 17px #397bf62b;filter:saturate(1.04)}
.btn .icon{width:17px;height:17px}
.btn.secondary{color:#45627f;background:#fff;border:1px solid var(--line);box-shadow:none}
.btn.secondary:hover{border-color:#b8d0f6;color:var(--blue);box-shadow:0 4px 12px #397bf610}
.btn.danger{color:#c7485d;background:#fff;border:1px solid #f4cbd1;box-shadow:none}
.btn.danger:hover{background:#fff7f8;border-color:#e9a4af}
.btn.small{min-height:34px;padding:0 11px;font-size:11px;border-radius:9px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 9px;border-radius:999px;background:#eef4fb;color:#5d7490;font-size:11px;font-weight:600;white-space:nowrap}
.pill .icon{width:13px;height:13px}
.pill.green{background:var(--green-2);color:#168d6c}
.pill.blue{background:var(--blue-2);color:#3170db}
.pill.gold{background:var(--gold-2);color:#a77714}
.pill.red{background:var(--red-2);color:#c34b60}
.pill.neutral{background:#eef1f5;color:#8795a5}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.panel-pad{padding:clamp(16px,2vw,24px)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.section-head h2{font-size:15px;letter-spacing:-.02em;font-weight:700}
.section-head p{color:var(--muted);font-size:11px;margin-top:3px}
.text-muted{color:var(--muted)}
.small-text{font-size:11px;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:16px 0}
.empty-state{min-height:210px;display:grid;place-items:center;text-align:center;border:1px dashed #d9e5f1;border-radius:16px;padding:28px;color:var(--muted);background:#fbfdff}
.empty-state .icon{width:30px;height:30px;color:#92aed1;margin:0 auto 10px}
.empty-state strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px}
.empty-state p{font-size:12px;max-width:360px}
/* Dashboard */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr);gap:22px;padding:clamp(22px,3.4vw,38px);border:1px solid #dceaf9;border-radius:22px;background:linear-gradient(112deg,#fff 0%,#f8fbff 54%,#edf9f6 100%);box-shadow:var(--shadow);margin-bottom:18px}
.hero:before{content:"";position:absolute;right:-110px;top:-190px;width:430px;height:430px;border-radius:50%;background:radial-gradient(circle at 40% 45%,#80b5ff35,transparent 70%);pointer-events:none}
.hero-copy,.hero-art{position:relative;z-index:1}
.hero-copy .eyebrow{margin-bottom:13px}
.hero-copy h2{font-size:clamp(25px,3vw,38px);letter-spacing:-.055em;line-height:1.36;max-width:560px}
.hero-copy h2 span{color:var(--blue)}
.hero-copy p{margin-top:11px;max-width:560px;color:var(--muted);font-size:12px;line-height:1.9}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.hero-art{min-height:180px;display:flex;align-items:center;justify-content:center}
.hero-art-card{position:relative;width:min(100%,300px);height:182px;border:1px solid #d9e8f6;border-radius:18px;background:rgba(255,255,255,.84);box-shadow:0 20px 36px #3f79bb12;padding:17px;transform:rotate(2deg)}
.hero-art-card:before{content:"";position:absolute;top:13px;left:15px;width:6px;height:6px;border-radius:99px;background:#6ab9a2;box-shadow:12px 0 0 #9dc5ee,24px 0 0 #edd18d}
.art-line{height:7px;border-radius:10px;background:#eaf1f7;margin-top:10px;width:58%}
.art-line.long{width:77%;height:9px;background:#dce9fc;margin-top:25px}
.art-bars{display:flex;align-items:flex-end;gap:7px;height:65px;margin-top:12px;padding:0 5px}
.art-bars i{display:block;flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#5d9af8,#a4c7fd);animation:bar-rise .7s ease both;transform-origin:bottom}
.art-bars i:nth-child(1){height:28%}.art-bars i:nth-child(2){height:43%;animation-delay:.06s}.art-bars i:nth-child(3){height:35%;animation-delay:.12s}.art-bars i:nth-child(4){height:62%;animation-delay:.18s}.art-bars i:nth-child(5){height:48%;animation-delay:.24s}.art-bars i:nth-child(6){height:77%;animation-delay:.3s}.art-bars i:nth-child(7){height:90%;background:linear-gradient(180deg,#55c9a2,#b1ead9);animation-delay:.36s}
.hero-stamp{position:absolute;right:14px;top:28px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#397bf6,#37bea4);color:#fff;box-shadow:0 7px 15px #397bf62c;transform:rotate(-7deg)}
.hero-stamp .icon{width:25px;height:25px}
.stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:27px}
.stat-card{padding:18px 19px;min-width:0;display:flex;gap:12px;align-items:flex-start}
.stat-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#eaf2ff;color:#3d7cf0;flex:none}
.stat-icon.green{background:#e7f8f1;color:#1eab81}.stat-icon.gold{background:#fff5dc;color:#bc8a22}.stat-icon.purple{background:#f2edff;color:#8664cc}
.stat-icon .icon{width:20px;height:20px}
.stat-content{min-width:0}
.stat-label{font-size:11px;color:var(--muted);white-space:nowrap}
.stat-value{font-size:27px;font-weight:700;line-height:1.3;letter-spacing:-.05em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-foot{font-size:10px;color:#91a0b3;margin-top:4px;white-space:nowrap}
.dashboard-columns{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:18px;align-items:start}
.activity-list{display:grid;gap:0}
.activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #edf1f6;min-width:0}
.activity-item:first-child{border-top:0;padding-top:0}
.activity-info{min-width:0;flex:1}
.activity-info strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-info small{font-size:10px;color:var(--muted);display:block;margin-top:3px}
.activity-score{text-align:right;white-space:nowrap}
.activity-score strong{font-size:16px;letter-spacing:-.03em;display:block}
.quick-actions{display:grid;gap:10px}
.quick-action{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;transition:border-color .18s,transform .18s}
.quick-action:hover{border-color:#b8d0f6;transform:translateY(-1px)}
.quick-action .quick-icon{width:38px;height:38px;border-radius:12px;background:#edf4ff;color:var(--blue);display:grid;place-items:center;flex:none}
.quick-action .quick-icon.green{background:#e9f8f2;color:var(--green)}
.quick-action strong{display:block;font-size:12px}.quick-action small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.quick-action>.icon{margin-left:auto;color:#a4b3c5}
/* Toolbars / song browser */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.search-box{position:relative;flex:1;min-width:230px}
.search-box>.icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9aabc0;width:17px;height:17px;pointer-events:none}
.search-input{width:100%;padding-left:39px;height:42px;font-size:12px}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:17px}
.filter-chip{min-height:32px;padding:4px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;color:#74869b;font-size:11px;white-space:nowrap;transition:all .16s}
.filter-chip:hover{border-color:#bdd2f1;color:#397bf6}
.filter-chip.active{border-color:#397bf6;background:#eaf2ff;color:#3170dc;font-weight:700}
.filter-chip .icon{width:14px;height:14px}
.toolbar-spacer{flex:1}
.toolbar-count{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.control-button{height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line);background:#fff;color:#596f88;font-size:11px;white-space:nowrap;transition:all .18s}
.control-button:hover{border-color:#b8d0f6;color:var(--blue)}
.control-button .icon{width:16px;height:16px}
.control-button.active{background:#eaf2ff;border-color:#d2e2fd;color:#3170dc}
.view-toggle{font-weight:600}
.view-toggle .icon{width:16px;height:16px}
.virtual-scroll{height:min(66vh,780px);min-height:360px;overflow:auto;position:relative;border-radius:15px;scrollbar-gutter:stable;overscroll-behavior:contain;contain:layout paint style;background:transparent}
.virtual-space{position:relative;width:100%;min-height:1px}
.virtual-row{position:absolute;left:0;right:0;top:0;display:grid;align-items:stretch}
.song-list-item{height:100%;min-width:0;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:13px;background:#fff;text-align:left;transition:border-color .16s,box-shadow .16s,transform .16s;overflow:hidden}
.song-list-item:hover,.song-jacket-card:hover{border-color:#bfd4f3;box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.jacket{position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:linear-gradient(140deg,hsl(var(--hue,210) 80% 87%),hsl(calc(var(--hue,210) + 45) 72% 68%));flex:none;aspect-ratio:1;border-radius:12px}
.jacket:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 22% 17%,#ffffffbd,transparent 34%),linear-gradient(130deg,transparent 35%,#ffffff47 35% 38%,transparent 38% 62%,#ffffff38 62% 65%,transparent 65%)}
.jacket:after{content:"";position:absolute;inset:19%;border:1px solid #ffffffb8;border-radius:50%;box-shadow:0 0 0 9px #ffffff2b,0 0 0 20px #ffffff18}
.jacket-mark{width:39%;height:39%;display:grid;place-items:center;border-radius:50%;background:#ffffffad;color:#3a5e80;z-index:1;backdrop-filter:blur(3px)}
.jacket-mark .icon{width:55%;height:55%;stroke-width:1.5}
.song-list-item .jacket{width:58px}
.song-main{min-width:0;flex:1}
.song-main strong{display:block;font-size:12px;line-height:1.5;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-main small{display:block;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.song-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.unit-tag{font-size:9px;font-weight:700;color:#5c7d93;background:#edf5f7;border-radius:5px;padding:2px 6px;white-space:nowrap}
.difficulty-dots{display:flex;align-items:center;gap:7px;flex:none}
.diff-dot{height:11px;width:11px;display:inline-block;border-radius:50%;background:var(--dot,#cbd5e1);box-shadow:0 0 0 2px #fff,0 0 0 3px #e8eef6;flex:none}
.song-jacket-card{min-width:0;width:100%;height:100%;padding:9px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .16s,box-shadow .16s,transform .16s;overflow:hidden}
.song-jacket-card .jacket{width:100%;border-radius:10px}
.song-jacket-card strong{display:block;width:100%;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-jacket-card .song-card-sub{font-size:9px;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-jacket-card .difficulty-dots{margin-top:auto;gap:7px;padding:0 1px 2px}
/* Result cards */
.result-card{min-width:0;width:100%;height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 2px 7px #1b47750a;text-align:left;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.result-card:hover{transform:translateY(-2px);border-color:#c3d7f4;box-shadow:0 9px 22px #2e65a70e}
.result-visual{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;display:block;background:linear-gradient(125deg,hsl(var(--hue,215) 78% 77%),hsl(calc(var(--hue,215) + 52) 70% 48%));isolation:isolate;flex:none}
.result-visual:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a1c3a17,transparent 55%),radial-gradient(circle at 75% 20%,#ffffff5e,transparent 30%);z-index:-1}
.result-visual:after{content:"";position:absolute;right:8%;top:-21%;width:44%;aspect-ratio:1;border:1px solid #ffffff8c;border-radius:50%;box-shadow:0 0 0 15px #ffffff20,0 0 0 32px #ffffff13;z-index:-1}
.mock-topline{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:8px;letter-spacing:.12em;font-weight:700;text-shadow:0 1px 6px #122d4b50}
.mock-mini-bars{display:flex;gap:3px;align-items:center}
.mock-mini-bars i{display:block;width:3px;height:7px;background:#fff;border-radius:3px}.mock-mini-bars i:nth-child(2){height:11px}.mock-mini-bars i:nth-child(3){height:5px}
.mock-result-center{position:absolute;left:9%;top:32%;width:48%;color:#fff;text-shadow:0 2px 9px #12325b38}
.mock-result-center small{display:block;font-size:8px;letter-spacing:.18em;font-weight:700;opacity:.9}
.mock-result-center strong{display:block;font-size:clamp(14px,1.3vw,20px);line-height:1.25;letter-spacing:.04em;margin-top:4px}
.mock-result-center span{font-size:9px;display:block;margin-top:5px;opacity:.9}
.mock-score{position:absolute;right:8%;top:33%;width:34%;height:45%;border-radius:8px;background:#ffffffcf;backdrop-filter:blur(4px);padding:9px 8px;box-shadow:0 4px 12px #152e471c;display:flex;flex-direction:column;justify-content:center;gap:5px}
.mock-score i{display:block;height:4px;border-radius:99px;background:#abc4dd}.mock-score i:nth-child(1){width:87%;background:#5a8fe8}.mock-score i:nth-child(2){width:65%}.mock-score i:nth-child(3){width:76%}.mock-score i:nth-child(4){width:44%}
.mock-clear{position:absolute;left:10px;bottom:9px;padding:3px 7px;border:1px solid #ffffffaa;border-radius:5px;background:#ffffff2f;color:#fff;font-size:8px;font-weight:700;letter-spacing:.09em}
.actual-result-image{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;display:block}
.result-card-body{padding:12px 13px 13px;display:grid;gap:7px;min-width:0;flex:1}
.result-title{display:block;font-size:12px;line-height:1.5;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-tags{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.diff-label{display:inline-flex;align-items:center;gap:6px;padding:3px 7px;border-radius:6px;color:var(--diff-color,#4f83da);background:var(--diff-bg,#edf4ff);font-size:9px;font-weight:700;white-space:nowrap}
.state-label{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:9px;font-weight:700;white-space:nowrap;color:#7b8b9f;background:#edf1f5}
.state-label.FC{color:#a17615;background:#fff3d2}.state-label.AP{color:#555783;background:linear-gradient(105deg,#e8efff 0%,#f0e8ff 28%,#ffe8f0 54%,#fff1d8 76%,#e1f8ef 100%);border:1px solid #e7e8f7}.state-label.CLEAR{color:#3472dc;background:#eaf2ff}
.result-metrics{display:flex;align-items:baseline;gap:6px;min-width:0}
.result-miss{font-size:24px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.05em;color:#2e73e7}
.result-miss-label{font-size:10px;color:var(--muted)}
.result-combo{margin-left:auto;font-size:10px;color:#6e8199;white-space:nowrap}
.result-combo strong{color:var(--ink);font-weight:700}
.result-date{display:flex;align-items:center;gap:5px;color:#8796a9;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-date .icon{width:13px;height:13px}
.pb-mark{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;background:#fff5da;color:#c18a19;flex:none}
.pb-mark .icon{width:12px;height:12px}
/* Song details / result selector */
.breadcrumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:17px;color:var(--muted);font-size:11px}
.breadcrumbs button{color:#4c79bd;font-weight:600}.breadcrumbs button:hover{text-decoration:underline}
.breadcrumbs .icon{width:13px;height:13px}
.song-profile{display:flex;align-items:center;gap:17px;padding:18px 20px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(100deg,#fff,#f8fbff);margin-bottom:22px}
.song-profile .jacket{width:86px;border-radius:12px}
.song-profile-main{min-width:0;flex:1}
.song-profile h2{font-size:19px;line-height:1.45;letter-spacing:-.035em;white-space:normal;overflow-wrap:anywhere}
.song-profile p{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}
.song-profile-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.difficulty-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:24px}
.difficulty-card{min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;transition:border-color .18s,transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.difficulty-card:hover{border-color:#bed3f4;transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.difficulty-card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--diff-color,#9aafc4)}
.difficulty-card .difficulty-name{font-size:11px;font-weight:700;color:var(--diff-color);letter-spacing:.06em}
.difficulty-card .difficulty-level{display:block;font-size:27px;font-weight:700;letter-spacing:-.06em;line-height:1.25;margin-top:7px}
.difficulty-card .difficulty-level small{font-size:10px;color:var(--muted);letter-spacing:0;margin-left:4px}
.difficulty-card .difficulty-stat{font-size:10px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.difficulty-card .difficulty-stat .icon{width:13px;height:13px}
.subsection-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:23px 0 12px}
.subsection-title h2{font-size:15px;font-weight:700;letter-spacing:-.02em}
/* History / chart */
.chart-wrap{padding:19px 20px 14px}
.chart-legend{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px}
.legend-dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.legend-dot.green{background:var(--green)}
.history-chart{display:block;width:100%;height:auto;overflow:visible;margin-top:12px;min-height:175px}
.history-chart text{font-family:inherit;fill:#8697aa;font-size:10px}
.history-chart .grid-line{stroke:#e8eef5;stroke-width:1}
.history-chart .trend-line{fill:none;stroke:#4b8bf0;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
.history-chart .point{fill:#fff;stroke:#4b8bf0;stroke-width:2.5}
.history-chart .point.pb{stroke:#20b58a;fill:#e5f8f1}
.history-chart .point-label{fill:#3d73c7;font-size:9px;font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.data-table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.data-table thead th{position:sticky;top:0;z-index:1;background:#f8fbff;color:#7b8da3;font-size:10px;font-weight:600;text-align:left;padding:12px 13px;border-bottom:1px solid var(--line)}
.data-table tbody td{font-size:11px;padding:11px 13px;border-bottom:1px solid #edf2f7}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr[data-a]{cursor:pointer;transition:background .15s}
.data-table tbody tr[data-a]:hover{background:#f8fbff}
.num-good{color:#258f75;font-weight:700}.num-warn{color:#bd7b25;font-weight:700}
.history-record-list{display:grid;gap:0}
.history-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #eef2f7;min-width:0}
.history-row:first-child{border-top:0}
.history-row .history-date{font-size:10px;color:var(--muted);width:144px;flex:none}
.history-row .history-val{font-size:11px;font-weight:700;white-space:nowrap}
.history-row .history-combo{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
/* Upload / sync */
.demo-banner{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid #d6e7fb;background:#f1f7ff;color:#5b7595;font-size:11px;line-height:1.7;margin-bottom:17px}
.demo-banner .icon{color:#4c85df;width:17px;height:17px;margin-top:1px}
.upload-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:17px;align-items:start}
.upload-drop{display:grid;justify-items:center;text-align:center;gap:9px;min-height:250px;border:1.5px dashed #bbd1ef;border-radius:17px;background:linear-gradient(145deg,#fbfdff,#f4f9ff);padding:28px;cursor:pointer;transition:border-color .18s,background .18s}
.upload-drop:hover,.upload-drop.dragover{border-color:#4e8bf0;background:#f0f7ff}
.upload-drop .drop-icon{width:47px;height:47px;border:1px solid #d8e8fb;border-radius:15px;background:#fff;color:#397bf6;display:grid;place-items:center;margin-bottom:3px;box-shadow:0 4px 12px #397bf612}
.upload-drop .drop-icon .icon{width:24px;height:24px}
.upload-drop strong{font-size:14px}
.upload-drop p{font-size:11px;color:var(--muted);max-width:350px}
.upload-drop .file-note{font-size:10px;color:#90a0b2}
.sync-step-list{display:grid;gap:0}
.sync-step{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-top:1px solid #edf2f7}
.sync-step:first-child{border-top:0;padding-top:0}
.sync-step-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#edf4ff;color:#447fe4;flex:none}
.sync-step-icon .icon{width:16px;height:16px}
.sync-step strong{display:block;font-size:11px}.sync-step small{display:block;color:var(--muted);font-size:10px;line-height:1.6;margin-top:3px}
.log-list{display:grid;gap:8px}
.log-item{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
.log-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:#e6f8f0;color:#168e6d}
.log-icon.error{background:#fff0f1;color:#d25367}.log-icon.warning{background:#fff6dc;color:#af7d17}
.log-icon .icon{width:15px;height:15px}
.log-text{min-width:0;flex:1}.log-text strong{display:block;font-size:11px;overflow-wrap:anywhere}.log-text p{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.6;overflow-wrap:anywhere}
.log-time{font-size:9px;color:#9aa8b8;white-space:nowrap}
.anomaly-card{padding:15px;border:1px solid #f1dfb7;border-radius:13px;background:#fffdf7;margin-top:9px}
.anomaly-card strong{font-size:11px}.anomaly-card p{font-size:10px;color:var(--muted);margin:4px 0 11px;line-height:1.65}
.anomaly-actions{display:flex;gap:7px;flex-wrap:wrap}
/* Modal */
#modal-root{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:clamp(8px,2vw,24px);background:#142f4b66;backdrop-filter:blur(7px)}
#modal-root.open{display:flex;animation:fade-in .18s ease both}
.modal-panel{position:relative;width:min(1040px,100%);max-height:min(94vh,1000px);overflow:auto;border:1px solid #ffffffcc;border-radius:22px;background:#fff;box-shadow:0 24px 80px #122a4933;padding:clamp(18px,2.8vw,30px);animation:modal-in .22s ease both;overscroll-behavior:contain}
.modal-panel.compact{width:min(660px,100%)}
.modal-close{position:sticky;float:right;top:0;z-index:3;width:36px;height:36px;margin:-8px -8px 0 8px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#72849a;display:grid;place-items:center}
.modal-close:hover{color:var(--blue);border-color:#bdd3f4}
.modal-header{padding-right:40px;margin-bottom:18px}
.modal-header h2{font-size:21px;line-height:1.4;letter-spacing:-.035em}
.modal-header p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.7}
.detail-top{display:grid;grid-template-columns:116px minmax(0,1fr);gap:18px;align-items:center;margin:2px 0 20px}
.detail-top .jacket{width:116px;border-radius:15px}
.detail-song-title{font-size:23px;font-weight:700;letter-spacing:-.045em;line-height:1.45;overflow-wrap:anywhere}
.detail-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.detail-release-short{color:var(--muted);font-size:10px;margin-top:8px}
.detail-image-panel{padding:10px;border:1px solid var(--line);border-radius:16px;background:#f8fbff}
.detail-result-visual{max-height:380px;aspect-ratio:16/7;width:100%;border-radius:10px}
.detail-result-visual .mock-result-center strong{font-size:clamp(20px,3vw,32px)}
.detail-result-visual .mock-result-center small{font-size:10px}.detail-result-visual .mock-result-center span{font-size:11px}
.detail-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:14px}
.detail-stat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;min-width:0}
.detail-stat .label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}
.detail-stat .label .icon{width:14px;height:14px}
.detail-stat strong{display:block;font-size:27px;line-height:1.3;margin-top:3px;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.detail-stat strong small{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0}
.judgement-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.judgement{padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;min-width:0}
.judgement span{display:block;font-size:10px;color:var(--muted)}
.judgement strong{display:block;font-size:18px;margin-top:3px;font-weight:700;font-variant-numeric:tabular-nums}
.judgement.perfect{background:#f1f8ff;border-color:#dceaff}.judgement.perfect strong{color:#397bf6}
.judgement.great strong{color:#e5ad32}.judgement.good strong{color:#28a981}.judgement.bad strong{color:#dc8c42}.judgement.miss strong{color:#da5c72}
.detail-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.detail-info-list{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0;margin-top:8px}
.detail-info-row{display:contents}
.detail-info-row dt,.detail-info-row dd{padding:11px 0;border-bottom:1px solid #edf2f7;font-size:11px}
.detail-info-row dt{color:var(--muted)}.detail-info-row dd{min-width:0;overflow-wrap:anywhere}
.detail-info-row:last-child dt,.detail-info-row:last-child dd{border-bottom:0}
.edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.form-field{display:grid;gap:5px;min-width:0}.form-field label{font-size:10px;color:var(--muted);font-weight:600}
.form-field input{width:100%;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-variant-numeric:tabular-nums}
.form-hint{font-size:10px;color:var(--muted);line-height:1.65;margin-top:9px}
.notice-group{margin-top:20px}.notice-group h3{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:9px}
.notice-item{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;margin-top:7px;text-align:left;width:100%;min-width:0}
.notice-item:hover{border-color:#bdd3f4;background:#fbfdff}.notice-item>.jacket{width:46px;border-radius:10px}
.notice-item .notice-body{min-width:0;flex:1}.notice-item strong{display:block;font-size:11px;overflow-wrap:anywhere}.notice-item p{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.6}
.notice-item .notice-values{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.notice-value{padding:2px 6px;background:#e6f8f0;color:#148c69;border-radius:5px;font-size:9px;font-weight:700}
.choice-card{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;align-items:flex-start;gap:10px;margin-top:9px}
.choice-card input{margin-top:4px;accent-color:var(--blue)}
.choice-card strong{font-size:11px}.choice-card small{display:block;color:var(--muted);font-size:10px;line-height:1.6;margin-top:2px}
/* Transaction overlay and toast */
#lock-root{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:#142f4b59;backdrop-filter:blur(6px);padding:15px}
#lock-root.open{display:grid;animation:fade-in .15s ease both}
.lock-card{width:min(440px,100%);padding:29px 27px 25px;border-radius:20px;background:#fff;box-shadow:0 22px 70px #18375c36;display:grid;justify-items:center;gap:13px;text-align:center}
.lock-symbol{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#397bf6;background:#edf4ff}
.lock-symbol .icon{width:23px;height:23px}
.lock-card h2{font-size:16px}.lock-card p{font-size:11px;color:var(--muted);line-height:1.75}
.progress-track{width:100%;height:7px;border-radius:99px;background:#eaf0f6;overflow:hidden;margin-top:3px}
.progress-track span{display:block;height:100%;width:0;background:linear-gradient(90deg,#397bf6,#34c3a0);transition:width .25s ease;border-radius:99px}
.lock-foot{font-size:10px!important;color:#93a1b1!important}
.spinner{width:22px;height:22px;border:2px solid #cfe0f7;border-top-color:#397bf6;border-radius:50%;animation:spin .8s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:120;max-width:min(92vw,520px);padding:11px 16px;display:flex;align-items:center;gap:9px;border-radius:12px;background:#17324e;color:#fff;font-size:11px;box-shadow:0 9px 28px #14304a30;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.visible{opacity:1;transform:translate(-50%,0)}#toast .icon{width:16px;height:16px;color:#8ee0c1}
.mobile-scrim{display:none}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar-rise{from{transform:scaleY(.25);opacity:.4}to{transform:scaleY(1);opacity:1}}
@media(min-width:1440px){.result-card-body{padding:13px 15px 14px}.result-title{font-size:13px}}

function calculateOcrRegions(width,height){
  const Wi=Math.max(1,Number(width)||1),Hi=Math.max(1,Number(height)||1);
  const s=Math.min(Wi/OcrReference.baseWidth,Hi/OcrReference.baseHeight);
  const offsetX=(Wi-OcrReference.baseWidth*s)/2;
  const offsetY=Math.max(0,(Hi-OcrReference.baseHeight*s)/2);
  const out={};
  for(const [name,rect] of Object.entries(OcrReference.regions)){

    const x=rect.x*s+offsetX;
    const y=rect.y*s+(name==='title'||name==='difficulty'||name==='level'?0:offsetY);
    out[name]={x:Math.round(x),y:Math.round(y),w:Math.round(rect.w*s),h:Math.round(rect.h*s)};
  }

}

function getNewRecordNotices(){

    const earlier=resultGroup(record).filter(r=>r.id!==record.id&&!r.isNew);
    const changed=[];
    for(const [metric,label] of metrics){
      if(!state.noticeSettings[metric])continue;
      const old=earlier.length?Math.min(...earlier.map(r=>missMetric(r,metric))):null;
      const now=missMetric(record,metric);
      if(old===null||now<old)changed.push({label,old:old===null?'初記録':old,now,metric});

    if(state.noticeSettings.combo){
      const oldCombo=earlier.length?Math.max(...earlier.map(r=>r.combo)):null;

}

function chartMarkup(songId,diff,onlyPB=false){
  const list=records.filter(r=>r.songId===songId&&r.diff===diff).sort((a,b)=>a.capturedAt-b.capturedAt);

  const shown=onlyPB?list.filter(r=>keep.has(r.id)):list;
  if(!shown.length)return `<div class="empty-state" style="min-height:150px">${icon('chart')}<div><strong>表示できる推移がありません</strong><p>リザルトが追加されると、ここに推移が表示されます。</p></div></div>`;
  const W=760,H=246,padL=42,padR=18,padT=18,padB=35;
  const maxVal=Math.max(4,...list.map(r=>missMetric(r)));
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const x=(record,index)=>shown.length<2?padL+plotW/2:padL+index*plotW/(shown.length-1);
  const y=record=>padT+(missMetric(record)/maxVal)*plotH;
  let grid='';for(let i=0;i<=4;i++){const value=Math.round(maxVal*i/4),yy=padT+plotH*i/4;grid+=`<line class="grid-line" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/><text x="${padL-9}" y="${yy+3}" text-anchor="end">${value}</text>`;}

  const points=shown.map((r,i)=>`<circle class="point ${keep?.has(r.id)?'pb':''}" cx="${x(r,i).toFixed(1)}" cy="${y(r).toFixed(1)}" r="4"><title>${formatDate(r.capturedAt)} / ${missMetric(r)} / コンボ ${r.combo}</title></circle>`).join('');
  return `<svg class="history-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="ミス数の推移。上にあるほど良い記録です">${grid}<path class="trend-line" d="${path}"/>${points}<text x="${padL}" y="${H-10}">${formatShortDate(shown[0].capturedAt)}</text><text x="${W-padR}" y="${H-10}" text-anchor="end">${formatShortDate(shown[shown.length-1].capturedAt)}</text><text x="${padL}" y="11">${state.metric==='tournament'?'大会基準のミス数':`${METRIC_INFO[state.metric].label}のミス数`}（上ほど良い）</text></svg>`;
}

function mountVirtual(id,items,kind,renderKind=''){
  const viewport=document.getElementById(id);if(!viewport)return;
  const space=$('.virtual-space',viewport);if(!space)return;
  if(activeVirtualCleanup){activeVirtualCleanup();activeVirtualCleanup=null;}
  const renderItem=kind==='song'?(renderKind==='song-jacket'?songJacketItem:songListItem):resultCard;
  const getLayout=()=>{
    const width=Math.max(260,viewport.clientWidth||600),gap=kind==='song'&&renderKind==='song-list'?9:14;
    if(kind==='song'&&renderKind==='song-list')return {cols:1,rowHeight:82,gap};
    if(kind==='song'&&renderKind==='song-jacket'){
      const cols=getJacketCols(),cardWidth=(width-gap*(cols-1))/cols;
      return {cols,rowHeight:Math.ceil(cardWidth+103),gap};
    }
    const cols=Math.max(1,Math.min(4,Math.floor((width+gap)/(258+gap))));
    const cardWidth=(width-gap*(cols-1))/cols;
    return {cols,rowHeight:Math.ceil(cardWidth*9/16+151),gap};
  };
  let currentLayout=null;
  function paint(){
    if(!viewport.isConnected)return;
    const layout=getLayout();currentLayout=layout;
    const rowCount=Math.ceil(items.length/layout.cols);
    space.style.height=`${rowCount*layout.rowHeight}px`;
    space.innerHTML='';
    if(!rowCount)return;
    const start=Math.max(0,Math.floor(viewport.scrollTop/layout.rowHeight)-2);
    const end=Math.min(rowCount,Math.ceil((viewport.scrollTop+viewport.clientHeight)/layout.rowHeight)+2);
    const fragment=document.createDocumentFragment();
    for(let rowIndex=start;rowIndex<end;rowIndex++){
      const row=document.createElement('div');row.className='virtual-row';row.style.top=`${rowIndex*layout.rowHeight}px`;row.style.height=`${Math.max(30,layout.rowHeight-layout.gap)}px`;row.style.gridTemplateColumns=`repeat(${layout.cols},minmax(0,1fr))`;row.style.gap=`${layout.gap}px`;
      if(kind==='song'&&renderKind==='song-list')row.style.display='block';
      const slice=items.slice(rowIndex*layout.cols,Math.min(items.length,(rowIndex+1)*layout.cols));
      row.innerHTML=slice.map(renderItem).join('');fragment.appendChild(row);
    }
    space.appendChild(fragment);
  }
  const onScroll=()=>paint();const onResize=()=>{const next=getLayout();if(!currentLayout||next.cols!==currentLayout.cols||next.rowHeight!==currentLayout.rowHeight)paint();};
  viewport.addEventListener('scroll',onScroll,{passive:true});window.addEventListener('resize',onResize,{passive:true});
  activeVirtualCleanup=()=>{viewport.removeEventListener('scroll',onScroll);window.removeEventListener('resize',onResize);};
  activeVirtualRefresh=paint;paint();
}

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function runTransaction(title,steps,operation){
  if(busy){showToast('別の処理が進行中です。完了後に操作してください。');return false;}
  busy=true;let committed=false;
  const snapshot={
    records:records.map(record=>({...record})),
    logs:importLogs.map(log=>({...log})),
    anomalies:ANOMALIES.map(item=>({id:item.id,resolved:item.resolved})),
    nextLogId,latestSyncAt,lastNotices:lastNotices.slice(),
    state:{page:state.page,allSort:state.allSort,allDesc:state.allDesc,allPBOnly:state.allPBOnly}
  };
  try{
    try{sessionStorage.setItem('sekai-demo-transaction',JSON.stringify({startedAt:Date.now(),title}));}catch(_e){}
    showLock(title,steps);
    for(let i=0;i<steps.length;i++){
      $('#lockStep').textContent=steps[i];$('#lockProgress').style.width=`${Math.round((i+1)/steps.length*100)}%`;
      await sleep(380);
    }
    if(typeof operation==='function')await operation();
    committed=true;
  }catch(error){
    const previousIds=new Set(snapshot.records.map(record=>record.id));
    records.filter(record=>!previousIds.has(record.id)&&record.imageUrl?.startsWith('blob:')).forEach(record=>{try{URL.revokeObjectURL(record.imageUrl);}catch(_e){}});
    records.splice(0,records.length,...snapshot.records);
    importLogs=snapshot.logs;
    snapshot.anomalies.forEach(old=>{const target=ANOMALIES.find(item=>item.id===old.id);if(target)target.resolved=old.resolved;});
    nextLogId=snapshot.nextLogId;latestSyncAt=snapshot.latestSyncAt;lastNotices=snapshot.lastNotices;
    Object.assign(state,snapshot.state);
    importLogs.unshift({id:nextLogId++,file:'transaction',kind:'error',message:`処理を中断しました。変更をロールバックしました（デモ）。${error?.message||''}`,time:formatDate(Date.now())});
    showToast('処理に失敗しました。未完了の変更を破棄しました。');
  }finally{
    try{sessionStorage.removeItem('sekai-demo-transaction');}catch(_e){}
    hideLock();
  }
  if(committed)renderApp(false);
  return committed;
}

async function uploadFiles(fileList){
  const files=[...fileList].filter(file=>file&&file.type.startsWith('image/'));
  if(!files.length){showToast('画像ファイルを選択してください。');return;}
  await runTransaction('画像を追加してOCR解析中',['画像サイズと撮影日時を取得','リザルト領域を切り出し・画像補正','Google OCRを想定した文字認識','楽曲マスタ・難易度・レベルと照合','重複候補と自己ベストを確認'],async()=>{
    for(let i=0;i<files.length;i++){
      const file=files[i];
      const availableSong=SONGS.find(song=>Object.keys(song.diffs).some(diff=>records.some(r=>r.songId===song.id&&r.diff===diff)))||SONGS[0];
      const diff=Object.keys(availableSong.diffs).find(d=>records.some(r=>r.songId===availableSong.id&&r.diff===d))||Object.keys(availableSong.diffs)[0];
      const info=availableSong.diffs[diff],usedDate=Date.now()-(files.length-i)*60000;
      const url=URL.createObjectURL(file);
      const gr=Math.floor(random()*3),gd=Math.floor(random()*2),ba=Math.floor(random()),ms=Math.floor(random());
      createRecord(availableSong.id,diff,{great:gr,good:gd,bad:ba,miss:ms},Math.min(info.notes,Math.floor(info.notes*.8)),usedDate,Date.now(),{sourceName:file.name,imageUrl:url,isNew:true});
      importLogs.unshift({id:nextLogId++,file:file.name,kind:'success',message:'画像を追加しました。OCR結果はデモ用のサンプル値です。',time:formatDate(Date.now())});
    }
    showToast(`${files.length} 件の画像を追加しました（デモ）。`);
    state.page='results';state.allSort='added';state.allDesc=true;state.allPBOnly=false;
  });
}

  const index=records.findIndex(r=>r.id===Number(id));if(index<0)return;
  const record=records[index];if(record.imageUrl&&record.imageUrl.startsWith('blob:')){try{URL.revokeObjectURL(record.imageUrl);}catch(_e){}}
  records.splice(index,1);closeModal();importLogs.unshift({id:nextLogId++,file:record.sourceName||`sekai_result_${record.id}.png`,kind:'success',message:'リザルトと対応するDrive画像を削除した想定です（デモ）。',time:formatDate(Date.now())});showToast('リザルトを削除しました（デモ）。');renderApp(false);
}
function saveRecord(id){
  const record=records.find(r=>r.id===Number(id));if(!record)return;
  const keys=['great','good','bad','miss','combo'];const next={};
  for(const key of keys){const el=$(`#edit-${key}`);const raw=el?el.value:'';if(raw.trim()===''||!Number.isFinite(Number(raw))||Number(raw)<0||!Number.isInteger(Number(raw))){showToast('判定数とコンボ数は0以上の整数で入力してください。');return;}next[key]=Number(raw);}
  const notes=totalNotes(record);
  if(next.great+next.good+next.bad+next.miss>notes){showToast(`判定数の合計は総ノーツ数（${notes}）以下にしてください。`);return;}
  if(next.combo>notes){showToast(`コンボ数は総ノーツ数（${notes}）以下にしてください。`);return;}
  Object.assign(record,next);closeModal();showToast('修正内容を保存しました（デモ）。');renderApp(false);openDetail(id,false);
}
function handleAction(action,target){
  const value=target.dataset.v,mode=target.dataset.mode;
  switch(action){
    case 'navigate':navigate(value);break;
    case 'toggle-sidebar':toggleSidebar();break;
    case 'open-notices':closeMobileSidebar();openNotices();break;
    case 'account':openAccount();break;
    case 'close-modal':closeModal();break;
    case 'toggle-song-asc':state.songAsc=!state.songAsc;renderApp(false);break;
    case 'toggle-song-view':state.songView=state.songView==='list'?'jacket':'list';renderApp(false);break;
    case 'toggle-columns':state.denseColumns=!state.denseColumns;renderApp(false);break;
    case 'toggle-drive-only':state.driveOnly=!state.driveOnly;renderApp(false);break;
    case 'toggle-unit':state.units=state.units.includes(value)?state.units.filter(x=>x!==value):[...state.units,value];renderApp(false);break;
    case 'select-song':state.selectedSong=Number(value);state.selectedDiff=null;state.resultsPBOnly=false;state.page='songs';renderApp(true);break;
    case 'select-diff':state.selectedDiff=value;state.resultSort='miss';state.resultDesc=false;state.resultsPBOnly=false;renderApp(false);break;
    case 'back-songs':state.selectedSong=null;state.selectedDiff=null;renderApp(false);break;
    case 'toggle-result-desc':state.resultDesc=!state.resultDesc;renderApp(false);break;
    case 'toggle-song-pb':state.resultsPBOnly=!state.resultsPBOnly;renderApp(false);break;
    case 'toggle-all-desc':state.allDesc=!state.allDesc;renderApp(false);break;
    case 'toggle-all-pb':state.allPBOnly=!state.allPBOnly;renderApp(false);break;
    case 'history-diff':state.historyDiff=value;renderApp(false);break;
    case 'toggle-history-pb':state.historyPBOnly=!state.historyPBOnly;renderApp(false);break;
    case 'open-detail':closeModal();openDetail(value);break;
    case 'edit-record':openDetail(value,true);break;
    case 'edit-cancel':openDetail(value,false);break;
    case 'save-record':saveRecord(value);break;
    case 'confirm-delete-record':confirmDeleteRecord(value);break;
    case 'delete-record':deleteRecord(value);break;
    case 'rerun-ocr':closeModal();rerunOcr(value);break;
    case 'open-history':openHistoryForRecord(value);break;
    case 'sync':closeMobileSidebar();syncDrive();break;
    case 'resolve-anomaly':closeModal();resolveAnomaly(value,mode);break;
    case 'open-notice-settings':openNoticeSettings();break;
    case 'save-notice-settings':if(state.noticeSettingsDraft){state.noticeSettings={...state.noticeSettingsDraft};state.noticeSettingsDraft=null;}closeModal();updateNotificationBadge();showToast('通知条件を保存しました（デモ）。');break;
    case 'navigate-sync-close':closeModal();navigate('sync');break;
    case 'brand-home':navigate('home');break;
  }
}
document.addEventListener('click',event=>{
  const actionEl=event.target.closest('[data-a]');
  if(actionEl){if(busy)return;const action=actionEl.dataset.a;handleAction(action,actionEl);return;}
  if(event.target.id==='modal-root'){closeModal();}
});
document.addEventListener('change',event=>{
  const target=event.target,key=target.dataset.change;if(!key)return;if(busy)return;
  if(key==='songSort'){state.songSort=target.value;renderApp(false);}
  if(key==='sortDiff'){state.songLevelDiff=target.value;renderApp(false);}
  if(key==='resultSort'){state.resultSort=target.value;state.resultDesc=target.value==='added';renderApp(false);}
  if(key==='allSort'){state.allSort=target.value;state.allDesc=target.value==='added';renderApp(false);}
  if(key==='allLevelDiff'){state.allLevelDiff=target.value;renderApp(false);}
  if(key==='historySong'){state.historySong=Number(target.value);const song=songById(state.historySong);state.historyDiff=DIFFS.find(d=>song?.diffs[d]&&records.some(r=>r.songId===song.id&&r.diff===d))||Object.keys(song?.diffs||{})[0]||'expert';state.historyPBOnly=false;renderApp(false);}
  if(key==='metric'){state.metric=target.value;renderApp(false);}
  if(key==='file'){const files=target.files;uploadFiles(files);target.value='';}
  if(key==='notice-setting'){if(state.noticeSettingsDraft)state.noticeSettingsDraft[target.dataset.v]=target.checked;}
});
document.addEventListener('compositionstart',event=>{if(event.target.id==='songQuery')queryComposing=true;});
document.addEventListener('compositionend',event=>{
  if(event.target.id!=='songQuery'||busy)return;
  queryComposing=false;state.query=event.target.value;renderApp(false);
});
document.addEventListener('input',event=>{
  if(event.target.dataset.input!=='query'||busy)return;
  state.query=event.target.value;
  // 日本語IMEの変換中はDOMを再描画せず、変換確定後に検索結果を更新する。
  if(queryComposing||event.isComposing)return;
  const oldStart=event.target.selectionStart;
  renderApp(false);
  const input=$('#songQuery');if(input){input.focus({preventScroll:true});try{input.setSelectionRange(oldStart,oldStart);}catch(_e){}}
});
$('#metricSelect').addEventListener('change',event=>{if(busy)return;state.metric=event.target.value;renderApp(false);});
$('#mobileScrim').addEventListener('click',closeMobileSidebar);
$('#brandHome').addEventListener('click',()=>navigate('home'));
document.addEventListener('click',event=>{
  const drop=$('#uploadDrop');if(drop&&event.target.closest('#uploadDrop')&&!event.target.closest('input')){const picker=$('#filePicker');if(picker&&event.target.closest('.upload-drop')&&event.target.closest('.file-note')===null&&event.target.closest('button')===null){/* label opens the native picker */}}
});
document.addEventListener('dragover',event=>{if(event.target.closest('#uploadDrop')){event.preventDefault();$('#uploadDrop')?.classList.add('dragover');}});
document.addEventListener('dragleave',event=>{if(event.target.closest('#uploadDrop'))$('#uploadDrop')?.classList.remove('dragover');});
document.addEventListener('drop',event=>{const drop=event.target.closest('#uploadDrop');if(!drop)return;event.preventDefault();drop.classList.remove('dragover');if(busy)return;uploadFiles(event.dataTransfer?.files||[]);});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&!busy&&$('#modal-root').classList.contains('open'))closeModal();if(event.key==='Escape')closeMobileSidebar();});
window.addEventListener('resize',()=>{if(window.innerWidth>800)closeMobileSidebar();});
(function recoverInterruptedDemoTransaction(){try{if(sessionStorage.getItem('sekai-demo-transaction')){sessionStorage.removeItem('sekai-demo-transaction');importLogs.unshift({id:nextLogId++,file:'transaction-recovery',kind:'warning',message:'前回の未完了デモ処理を検出し、変更を破棄した状態に戻しました。',time:formatDate(Date.now())});}}catch(_e){}})();
lastNotices=getNewRecordNotices();
renderApp(true);
</script>
</body>
</html>
